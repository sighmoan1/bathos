name: Adopt compatible Bathos design-system releases
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shared-design-system-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find and install the next compatible release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_MANAGER: pnpm
        run: node scripts/update-design-system.mjs
      - name: Install browser for verification
        if: steps.update.outputs.changed == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the updated consumer before publication
        if: steps.update.outputs.changed == 'true'
        run: pnpm verify
      - name: Publish checked adoption PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DESIGN_SYSTEM_UPDATE_TOKEN || github.token }}
          RELEASE_VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name 'Bathos design-system updates'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c codex/design-system-update
          git add package.json pnpm-lock.yaml
          git commit -m "Adopt Bathos design system $RELEASE_VERSION"
          git push --force-with-lease origin codex/design-system-update
          if ! gh pr view codex/design-system-update >/dev/null 2>&1; then
            gh pr create --head codex/design-system-update --title "Adopt Bathos design system $RELEASE_VERSION" --body "Compatible release verified before publication. The update workflow ran the consumer checks. Deployment follows merge."
          fi
          gh pr merge codex/design-system-update --squash --auto
