name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.cjs
      - run: pnpm build
      - run: npm ci --prefix workers/admin-oauth
      - run: npm test --prefix workers/admin-oauth
      - name: Install browser check runtime
        run: npm install --prefix /tmp/bathos-browser-check --no-package-lock playwright@1.64.0
      - name: Install Chromium
        run: /tmp/bathos-browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify mobile post manager
        run: NODE_PATH=/tmp/bathos-browser-check/node_modules node scripts/check-post-manager.cjs
