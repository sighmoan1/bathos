name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code without retaining credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - name: Install locked website dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked publishing Worker dependencies
        run: npm ci --prefix workers/admin-oauth
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Run release validation
        run: pnpm verify:release
